  title: 'Место презумпции недобросовестности в механизме защиты гражданских прав',
  author: 'Антонов Михаил Александрович',
  role: 'преподаватель кафедры гражданского права',
  institution: 'ФГБОУ ВО «Саратовская государственная юридическая академия»',
  event: 'Поволжский юридический конгресс', date: 'Ульяновск · 10 октября 2026',
  scenes: [
    {title:'Исходное противоречие', ref:'п. 5 ст. 10 · п. 2 ст. 434.1 ГК РФ', article:'Основной текст, абзац 1', steps:[
      {label:'Общее предположение', pause:2, cue:'«требует собственного правового основания»', speech:'Добросовестность участников гражданских правоотношений предполагается. Однако в той же системе гражданского права отдельные действия стороны переговоров связываются с противоположным предположением. При этом данное отступление требует собственного правового основания.'},
      {label:'Специальное обратное предположение', pause:1, cue:'«изменяет юридическое положение сторон»', speech:'Сосуществование этих правил заставляет выяснить, почему отступление от исходного доверия к участнику оборота допускается внутри регулирования, которое обязывает его действовать добросовестно. В своем исследовании я обращаюсь к этому противоречию, поскольку одного признания специального распределения бремени доказывания здесь недостаточно. Требуется установить, какое место презумпция недобросовестности занимает в механизме защиты гражданских прав и в каких пределах она действительно изменяет юридическое положение сторон.'}
    ]},
    {title:'Три правовых уровня', ref:'п. 3 ст. 1 · п. 5 ст. 10 ГК РФ', article:'Абзацы 2, 5, 8-9', steps:[
      {label:'Нормативный стандарт', pause:1, cue:'«оценку конкретного поведения»', speech:'Начну с различия, без которого дальнейшее рассуждение оказывается неточным. Требование пункта 3 статьи 1 ГК РФ определяет должное поведение при установлении, осуществлении и защите гражданских прав, исполнении гражданских обязанностей. Презумпция пункта 5 статьи 10 решает другой вопрос - задает исходную оценку конкретного поведения.'},
      {label:'Общий презумптивный режим', pause:1, cue:'«не изменяет юридического положения сторон»', speech:'Когда вводится обратное предположение, участнику оборота по-прежнему надлежит действовать добросовестно. Меняется порядок установления отклонения от этого стандарта, а не содержание требования. Самого различия между принципом и презумпцией, впрочем, недостаточно: необходимо правило, связывающее доказанные факты с обратным предположением. Без такой связи обычная оценка доказательств получает другое название, хотя не изменяет юридического положения сторон.'},
      {label:'Исключение внутри презумптивного режима', pause:1, cue:'«выступает нашей интерпретацией этой связи»', speech:'Есть все основания полагать, что специальная презумпция составляет исключение из общего презумптивного режима, сохраняя связь с самим принципом. А.А. Кравченко применительно к несостоятельности рассматривает ее как одно из реализационных проявлений принципа добросовестности. Поддерживая это направление, мы связываем реализационное значение с обеспечением предпосылки применения нормы, препятствующей извлечению преимущества из недобросовестного поведения; последнее уже выступает нашей интерпретацией этой связи.'}
    ]},
    {title:'Переговоры и доказательственный риск', ref:'п. 2 ст. 434.1 ГК РФ · п. 19 Пленума ВС РФ № 7', article:'Абзацы 3-4, 10', steps:[
      {label:'Прекращение переговоров само по себе', pause:1, cue:'«добросовестность предполагается»', speech:'Пункт 19 постановления Пленума Верховного Суда от 24 марта 2016 года № 7 позволяет увидеть оба режима одновременно. Прекращение переговоров без объяснения мотивов само по себе не свидетельствует о недобросовестности. Исходная позиция сохраняется: добросовестность предполагается.'},
      {label:'Предоставление информации', pause:1, cue:'«доведены до сведения другой стороны»', speech:'В подпункте 1 пункта 2 статьи 434.1 названы предоставление неполной или недостоверной информации, включая умолчание об обстоятельствах, которые в силу характера договора должны быть доведены до сведения другой стороны.'},
      {label:'Прекращение переговоров с предусмотренными законом признаками', pause:1, cue:'«какой из режимов применим»', speech:'Подпункт 2 охватывает внезапное и неоправданное прекращение переговоров при обстоятельствах, когда другая сторона не могла разумно этого ожидать. Для перехода к специальному режиму требуется установить предусмотренные законом обстоятельства. Недостаточно самого отказа продолжать переговоры. Суду не предлагается свободно выбирать между противоположными предположениями, исходя из общего впечатления о поведении сторон. Проверка фактов-оснований предшествует решению о том, какой из режимов применим.'},
      {label:'Риск неопровержения у ответчика', pause:2, cue:'«посредством специального правового правила»', speech:'При наличии этих оснований ответчик должен доказать добросовестность своих действий. Здесь обнаруживается различие с обычным опровержением общего предположения. Если недобросовестность установлена исследованием доказательств, мы имеем доказанный факт. При специальной презумпции устанавливаются факты-основания, после чего риск неопровержения предполагаемого обстоятельства несет другая сторона. Сохраняющаяся неопределенность разрешается посредством специального правового правила.'}
    ]},
    {title:'Основание специализации', ref:'С.А. Белоусов · законодательный дисбаланс', article:'Абзацы 5-7, 10, 12', steps:[
      {label:'Недостаточность трудности доказывания', pause:1, cue:'«необходимого для защиты элемента»', speech:'Но наличие такого правила еще не объясняет допустимость его введения. Ссылка на трудность доказывания или обычное информационное неравенство была бы слишком широкой: обратное предположение оказалось бы приемлемым почти для любого спора. Значение имеет более узкая ситуация: объективные обстоятельства содержательно связаны с предполагаемым нарушением, а особенности самого отношения существенно затрудняют прямое установление необходимого для защиты элемента.'},
      {label:'Соответствие цели и средства', pause:1, cue:'«пригодность средства для этих отношений»', speech:'С.А. Белоусов, рассматривая модели законодательного дисбаланса, выделяет несогласованность правовых целей и средств их достижения. Применительно к нашей проблеме данное различие позволяет проверять соответствие распределения риска назначению защищающей нормы. На наш взгляд, специализация оправданна, когда право предоставляет защиту, но порядок установления ее предпосылок препятствует осуществлению такой защиты в определенной группе отношений. Само неравенство процессуального положения еще не свидетельствует о дефекте регулирования. Проверяется пригодность средства для этих отношений.'},
      {label:'Введение правила и его применение', pause:1, cue:'«фактического основания исключения»', speech:'Следует, однако, развести обоснование законодательного решения и применение уже закрепленного правила. Особенности доступа к информации могут объяснять необходимость специализации. Суд в конкретном деле руководствуется установленными фактами-основаниями; истец по статье 434.1 не обязан дополнительно доказывать невозможность получить прямые доказательства недобросовестности. Профессиональный статус или принадлежность к условно сильной стороне также не заменяют фактического основания исключения.'}
    ]},
    {title:'Внутри механизма защиты', ref:'ст. 12 ГК РФ · п. 20 Пленума ВС РФ № 7', article:'Абзацы 13-18', steps:[
      {label:'Правовой результат защиты', pause:1, cue:'«с конкретным защитным последствием»', speech:'Установив условия специального исключения, вернемся к вопросу о его месте в механизме защиты. Если рассматривать этот механизм лишь как перечень конечных последствий, собственная роль презумпции останется неясной. Инструментальный подход позволяет соотнести ее с конкретным защитным последствием.'},
      {label:'Вспомогательная функция презумпции', pause:1, cue:'«доказательственной позиции по отдельному обстоятельству»', speech:'В классификации Б.И. Пугинского, изложенной И.П. Кожокарем, презумпции отнесены к вспомогательным инструментам, содействующим реализации других средств. Объединение с фикциями, виной и риском не означает тождества их природы. Существенно различие инструментальных функций, а при обращении к механизму регулирования - отделение охранительной направленности средства от его роли во взаимодействии с другими средствами. Презумпция недобросовестности не становится самостоятельным способом защиты по статье 12 ГК РФ: ее результат состоит в изменении исходной доказательственной позиции по отдельному обстоятельству.'},
      {label:'Защитное последствие определяется отдельно', pause:1, cue:'«полного основания ответственности»', speech:'Содержание защиты определяется другим средством - возмещением убытков или признанием сделки недействительной. При переговорах специальное предположение меняет оценку поведения, но не разрешает автоматически вопрос об убытках и остальных необходимых условиях. Пункт 20 постановления № 7 отдельно определяет направленность возмещения: вернуть потерпевшего в положение, в котором он находился бы, не вступив в переговоры. Вспомогательное средство не подменяет полного основания ответственности.'}
    ]},
    {title:'Кабальная сделка', ref:'п. 3 ст. 179 ГК РФ', article:'Абзацы 19-22', steps:[
      {label:'Действующий состав', pause:1, cue:'«использование такого положения другой стороной»', speech:'Проверить пределы такой конструкции позволяет кабальная сделка. Пункт 3 статьи 179 ГК РФ связывает ее оспаривание с крайней невыгодностью условий, вынужденностью совершения сделки вследствие стечения тяжелых обстоятельств и использованием такого положения другой стороной.'},
      {label:'Доказательственная трудность', pause:1, cue:'«исследовании недействительности сделок»', speech:'Потерпевший способен подтвердить тяжелые обстоятельства, вынужденность и крайнюю невыгодность условий, тогда как сознательное использование его положения контрагентом значительно труднее установить непосредственно. На уязвимое положение истца при доказывании оснований и значение презумпций для преодоления доказательственной асимметрии обращает внимание А.А. Карпова в исследовании недействительности сделок.'},
      {label:'Граница действующего права и предложения', pause:2, cue:'«как авторское предложение о развитии регулирования»', speech:'Прежде чем предложить решение, необходимо обозначить границу действующего права. В пункте 3 статьи 179 прямо не закреплена презумпция использования тяжелого положения потерпевшего. Одна ссылка на принцип добросовестности не дает основания представить предлагаемую конструкцию как уже действующее правило. Дальнейшее рассуждение имеет значение de lege ferenda - как авторское предложение о развитии регулирования.'},
      {label:'Комплекс доказанных обстоятельств', pause:1, cue:'«другой стороны о положении потерпевшего»', speech:'Представляется возможным презюмировать указанное использование при доказанности вынужденности сделки вследствие тяжелых обстоятельств, крайней невыгодности ее условий и обстоятельств, свидетельствующих об осведомленности другой стороны о положении потерпевшего.'},
      {label:'Предмет предположения', pause:1, cue:'«между ними и затруднениями контрагента»', speech:'Предположение относится к одному элементу состава. Ответчику сохраняется возможность показать самостоятельное экономическое основание условий либо отсутствие связи между ними и затруднениями контрагента.'},
      {label:'Состав сохраняется', pause:2, cue:'«значения элемента в составе кабальной сделки»', speech:'Здесь важно не утратить различие между устранением обстоятельства из основания недействительности и изменением порядка его установления. Исключение элемента меняло бы материально-правовой состав. Опровержимое презюмирование сохраняет его значение и допускает отказ в защите при опровержении предположения. Корректировка доказательственного положения сторон тем самым возможна без отказа от значения элемента в составе кабальной сделки.'}
    ]},
    {title:'Опровержимость и пределы', ref:'Определенное основание · определенный предмет', article:'Абзацы 9, 11-12, 18, 23', steps:[
      {label:'Опровержение доказательствами', pause:1, cue:'«несовместимых с предполагаемым фактом»', speech:'К связи с принципом добросовестности теперь приходится вернуться с другой стороны. Принцип определяет нормативные пределы специального средства, но не служит доказательством, опровергающим презумпцию. Презумптивный вывод опровергается доказательствами обстоятельств, несовместимых с предполагаемым фактом.'},
      {label:'Один предмет презюмирования', pause:1, cue:'«причинной связи или размера потерь»', speech:'Оставляем за собой право относить презумпцию недобросовестности к конкретному поведению либо к образующему его оценку элементу, сохраняя определенность предмета и действительную возможность опровержения. К этой категории нельзя автоматически отнести предположение причинной связи или размера потерь.'},
      {label:'Другие условия устанавливаются отдельно', pause:1, cue:'«в стадии защиты по одному делу»', speech:'Вспомогательная роль ограничивает объем презюмирования: остальные элементы основания защиты проверяются самостоятельно. На уровне регулирования формируется специальное правило; в конкретном споре оно обеспечивает установление предпосылки защиты. Создание средства и его применение не превращаются в стадии защиты по одному делу.'}
    ]},
    {title:'Авторское определение', ref:'М.А. Антонов · итог исследования', article:'Абзац 24', steps:[
      {label:'Специальное опровержимое правовое правило', pause:2, cue:'«на указанного правилом участника»', speech:'Под презумпцией недобросовестности в механизме защиты гражданских прав предлагается понимать специальное опровержимое правовое правило, в силу которого доказанность предусмотренных правом фактов-оснований позволяет предполагать недобросовестность конкретного поведения либо образующий ее элемент, возлагая риск неопровержения на указанного правилом участника.'},
      {label:'Обеспечение конкретного защитного средства', pause:2, cue:'Финал. Не перелистывать; пауза, затем ответы на вопросы.', speech:'Ее исключительный характер относится к общему презумптивному режиму, реализационное назначение связывается с принципом добросовестности, а вспомогательная роль раскрывается через обеспечение применения конкретного защитного средства. Определяя это место, мы одновременно обозначаем предел конструкции: специальное предположение не заменяет полного основания гражданско-правовой защиты.'}
    ]}
  ],
  qa:[
    {title:'Принцип и общее предположение',ref:'п. 3 ст. 1 · п. 5 ст. 10 ГК РФ',headline:'Должное поведение\nи исходная оценка',body:'Принцип определяет нормативный стандарт. Презумпция определяет исходную оценку поведения до установления оснований для противоположного вывода. Исключение из предположения не отменяет обязанности действовать добросовестно.',source:'ГК РФ, часть первая, редакция от 10.06.2026'},
    {title:'Факты-основания при переговорах',ref:'подп. 1 и 2 п. 2 ст. 434.1 ГК РФ',headline:'Два нормативных\nоснования',body:'1. Неполная или недостоверная информация, включая умолчание о подлежащих сообщению обстоятельствах.\n2. Внезапное и неоправданное прекращение переговоров, которого другая сторона не могла разумно ожидать. Основания альтернативны, а признаки внутри каждого основания подлежат установлению.',source:'Статья 434.1 ГК РФ'},
    {title:'Разъяснение Верховного Суда',ref:'п. 19 Пленума ВС РФ от 24.03.2016 № 7',headline:'Ответчик доказывает\nдобросовестность',body:'Само по себе прекращение переговоров без указания мотивов не свидетельствует о недобросовестности. При наличии обстоятельств подп. 1 или 2 п. 2 ст. 434.1 ГК РФ действует специальное предположение; добросовестность доказывает ответчик.',source:'Постановление № 7, редакция от 22.06.2021'},
    {title:'Доказанный факт и презумпция',ref:'Разграничение в статье М.А. Антонова',headline:'Доказанность\nили распределение риска',body:'Опровержение общей презумпции: недобросовестность устанавливается исследованием доказательств. Специальная презумпция: доказаны факты-основания, а неопределенность по предмету предположения разрешается специальным правилом. Равный итог не означает тождества механизма.',source:'Основной текст статьи, абзац 4'},
    {title:'Опровержимость',ref:'Авторская характеристика конструкции',headline:'Предположение\nоткрыто доказательствам',body:'Проверяемое фактическое основание и определенный предмет позволяют представить противоположные доказательства. Принцип ограничивает устройство и применение средства, но сам по себе не опровергает предполагаемый факт.',source:'Основной текст статьи, абзацы 9, 12'},
    {title:'Вспомогательное средство',ref:'ст. 12 ГК РФ · инструментальный подход',headline:'Предпосылка защиты\nвнутри механизма',body:'Классификация Б.И. Пугинского приводится в изложении И.П. Кожокаря. Презумпция содействует реализации другого средства; собственного защитного последствия она не определяет. Возмещение убытков и признание сделки недействительной имеют иные функции.',source:'Основной текст статьи, абзацы 14-17'},
    {title:'Действующий состав кабальной сделки',ref:'п. 3 ст. 179 ГК РФ · DE LEGE LATA',headline:'Использование положения\nвходит в состав',body:'Крайняя невыгодность условий; вынужденность совершения сделки вследствие стечения тяжелых обстоятельств; использование такого положения другой стороной. Сделка может быть признана судом недействительной по иску потерпевшего. Прямой презумпции последнего элемента пункт 3 не закрепляет.',source:'Статья 179 ГК РФ'},
    {title:'Авторское предложение по кабальной сделке',ref:'М.А. Антонов · DE LEGE FERENDA',headline:'Меняется порядок\nустановления элемента',body:'Доказаны вынужденность вследствие тяжелых обстоятельств, крайняя невыгодность условий и обстоятельства осведомленности контрагента. Предлагается презюмировать использование положения потерпевшего. Опровержение: самостоятельное экономическое основание условий либо отсутствие связи с затруднениями контрагента.',source:'Основной текст статьи, абзацы 21-22',proposal:true},
    {title:'Научные источники статьи',ref:'Доктрина и авторская интерпретация',headline:'Источники\nрассуждения',body:'С.А. Белоусов - законодательный дисбаланс, модели 2014 года и специализация 2016 года.\nА.А. Кравченко - реализация принципа в несостоятельности, 2020.\nА.А. Карпова - процессуальные особенности недействительности сделок, 2022.\nИ.П. Кожокарь - инструментальный подход, 2017; Б.И. Пугинский приводится в его изложении.',source:'Библиография исходной статьи; позиции переданы по ее тексту'},
    {title:'Итоговое определение',ref:'Авторская дефиниция',headline:'Специальное опровержимое\nправовое правило',body:'Доказанность предусмотренных правом фактов-оснований позволяет предполагать недобросовестность конкретного поведения либо образующий ее элемент, возлагая риск неопровержения на указанного правилом участника. Предел действия - отдельная предпосылка защиты.',source:'Основной текст статьи, заключительный абзац'}
  ],

  if(bc)bc.onmessage=e=>{const m=e.data;if(m?.protocol!==channelName||m.sender===actor)return;if(m.request){emit();return;}receive(m.state);if(presenter)$('#connection-note').textContent='Экраны синхронизированы';};
  addEventListener('storage',e=>{if(e.key===storageKey&&e.newValue){try{receive(JSON.parse(e.newValue));}catch{}}});
  addEventListener('message',e=>{const m=e.data;if(m?.protocol!==channelName)return;if(!peers.has(e.source)&&e.source!==window.opener)return;if(m.request){emit();return;}receive(m.state);});
  function mutate(fn){const latest=readSaved();if(latest&&(latest.revision>state.revision||latest.revision===state.revision&&latest.actor>state.actor))state=latest;fn();save();}
  function pauseTimer(){state.elapsed=elapsed();state.running=false;state.startedAt=0;}
  function go(scene,step=0){mutate(()=>{state.scene=scene;state.step=step;state.qa=null;});}
  function advance(direction){if(modal)return;if(state.qa!==null){mutate(()=>{state.qa=Math.min(D.qa.length-1,Math.max(0,state.qa+direction));});return;}const i=steps.indexOf(stepData());const n=steps[i+direction];if(n)go(n.scene,n.step);else if(direction>0){mutate(()=>pauseTimer());toast('Доклад завершен · A открывает резерв');}}
  function toast(text){const x=$('.status-toast');x.textContent=text;x.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{x.hidden=true;},2600);}
  function chrome(){const x=$('.chrome');if(!x)return;x.classList.add('show');clearTimeout(chromeTimer);chromeTimer=setTimeout(()=>x.classList.remove('show'),1800);}
  function closeModal(){modal=null;$('.dialog-backdrop').hidden=true;lastFocus?.focus?.();}
  function showModal(kind){if(modal===kind){closeModal();return;}modal=kind;lastFocus=document.activeElement;const d=$('.dialog');$('.dialog-backdrop').hidden=false;
    if(kind==='qa')d.innerHTML=`<div class="dialog-header"><h2 id="dialog-title">Вопросы из зала</h2><button data-act="close-modal">Закрыть · Esc</button></div><div class="qa-grid">${D.qa.map((q,i)=>`<button data-qa="${i}"><small>${i===9?'0':i+1}</small><span>${esc(q.title)}</span></button>`).join('')}</div><p>Резервные сцены не входят в десятиминутный доклад.</p>`;
    else d.innerHTML=`<div class="dialog-header"><h2 id="dialog-title">Управление</h2><button data-act="close-modal">Закрыть · Esc</button></div><dl class="help-grid"><dt>→ · Space · Enter · PageDown</dt><dd>Следующий смысловой шаг</dd><dt>← · PageUp</dt><dd>Предыдущий шаг</dd><dt>F</dt><dd>Полный экран</dd><dt>P</dt><dd>Открыть экран докладчика</dd><dt>T</dt><dd>Начать / приостановить таймер</dd><dt>A · Q</dt><dd>Резервные сцены; 1-9 и 0 выбирают тему</dd><dt>Esc</dt><dd>Закрыть меню / вернуться из резерва</dd><dt>M · G</dt><dd>Сокращенное движение / плоская геометрия</dd><dt>B · .</dt><dd>Черный экран</dd><dt>Home</dt><dd>Первая сцена</dd></dl><p>На втором мониторе открой экран аудитории, перенеси его на проектор и нажми F. Перед началом речи запусти таймер клавишей T. Щелчок или касание экрана также переводит к следующему шагу.</p><div class="help-links"><a href="static/index.html">Статическая версия</a>${isStandalone?'':`<a href="standalone.html" download>Автономный HTML</a><a href="fallback.pdf">PDF</a>`}</div>`;
    d.focus();
  }
  function selectQA(n){closeModal();mutate(()=>{pauseTimer();state.qa=n;});}
  function openPeer(mode){let url;if(isStandalone){url=new URL(location.href);url.search='';if(mode==='presenter')url.searchParams.set('presenter','1');}else url=new URL(mode==='presenter'?'presenter/':'present/',document.baseURI);const child=window.open(url.href,mode==='presenter'?'antonov-presenter':'antonov-audience');if(child){peers.add(child);toast(mode==='presenter'?'Экран докладчика открыт':'Экран аудитории открыт');}else toast('Разреши открытие дополнительного окна для двух экранов');}
  async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('Полный экран недоступен; используй F11 в браузере');}}
  function action(name){switch(name){case'next':advance(1);break;case'back':advance(-1);break;case'qa':showModal('qa');break;case'help':showModal('help');break;case'close-modal':closeModal();break;case'fullscreen':full();break;case'presenter':openPeer('presenter');break;case'audience':openPeer('audience');break;case'timer':mutate(()=>{if(state.running)pauseTimer();else{state.running=true;state.startedAt=Date.now();}});break;case'reset-timer':mutate(()=>{state.elapsed=0;state.running=false;state.startedAt=0;});break;case'home':go(0,0);break;case'reduced':mutate(()=>state.reduced=!state.reduced);toast(state.reduced?'Сокращенное движение включено':'Основное движение включено');break;case'flat':mutate(()=>state.flat=!state.flat);toast(state.flat?'Плоская геометрия включена':'Пространственная геометрия включена');break;case'blackout':$('.blackout').hidden=!$('.blackout').hidden;break;}}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){action(b.dataset.act);return;}const q=e.target.closest('[data-qa]');if(q){selectQA(+q.dataset.qa);return;}const jump=e.target.closest('[data-scene]');if(jump){go(+jump.dataset.scene);return;}if(e.target.classList.contains('dialog-backdrop')){closeModal();return;}if(!presenter&&!modal&&e.target.closest('.viewport')&&!e.target.closest('a,button'))advance(1);});
  document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select'))return;const k=e.key;if(modal){if(k==='Escape'){e.preventDefault();closeModal();return;}if(modal==='qa'&&/^[0-9]$/.test(k)){e.preventDefault();selectQA(k==='0'?9:+k-1);return;}if(k==='Tab'){const items=[...$('.dialog').querySelectorAll('button,a')];if(items.length){const first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('.dialog'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}return;}
    if(k==='Escape'&&state.qa!==null){e.preventDefault();mutate(()=>state.qa=null);return;}if((k===' '||k==='Enter')&&e.target.closest('button,a'))return;
    const map={ArrowRight:'next',ArrowLeft:'back',' ':'next',Enter:'next',PageDown:'next',PageUp:'back',Home:'home',f:'fullscreen',F:'fullscreen',p:'presenter',P:'presenter',a:'qa',A:'qa',q:'qa',Q:'qa',h:'help',H:'help',t:'timer',T:'timer',m:'reduced',M:'reduced',g:'flat',G:'flat',b:'blackout',B:'blackout','.':'blackout'};
    if(map[k]){e.preventDefault();action(map[k]);}
  });
  let swiping=false;
  document.addEventListener('pointerdown',e=>{pointerX=e.clientX;swiping=false;});
  document.addEventListener('pointerup',e=>{if(!presenter&&!modal&&e.pointerType==='touch'&&Math.abs(e.clientX-pointerX)>70){swiping=true;advance(e.clientX<pointerX?1:-1);}});
  document.addEventListener('click',e=>{if(swiping){e.stopImmediatePropagation();swiping=false;}},true);
  addEventListener('resize',fit);addEventListener('fullscreenchange',()=>{document.body.dataset.fullscreen=String(!!document.fullscreenElement);fit();});document.addEventListener('mousemove',chrome);
  const observer=new ResizeObserver(fit);if(presenter)document.querySelectorAll('.preview-wrap').forEach(x=>observer.observe(x));
  const timer=setInterval(()=>{if(presenter)updateClock();},250);
  const media=matchMedia('(prefers-reduced-motion: reduce)');media.addEventListener('change',()=>render(true));
  if(new URLSearchParams(location.search).has('flat'))state.flat=true;
  if(new URLSearchParams(location.search).has('reduced'))state.reduced=true;
  render();
  const request={protocol:channelName,sender:actor,request:true};try{bc?.postMessage(request);}catch{}if(window.opener){try{window.opener.postMessage(request,'*');}catch{}}
  addEventListener('beforeunload',()=>{clearInterval(timer);observer.disconnect();try{bc?.close();}catch{}});
  if(!isStandalone&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register(new URL('sw.js',document.baseURI)).catch(()=>{});}
  window.KEYNOTE_API={getState:()=>({...state}),next:()=>advance(1),prev:()=>advance(-1),go,qa:selectQA,action,stepData:()=>({...stepData()}),elapsed,steps,words:()=>({written:steps.reduce((n,t)=>n+words(t.speech),0),spoken:totalWords,pauses,wordsPerMinute:totalWords/((600-pauses)/60)}),sceneMarkup,qaMarkup,closeModal,fit,theme,escape:esc};
})();
</script><noscript><div class="noscript">Для автономной версии без JavaScript: <a href="static/index.html">открыть статические сцены</a>.</div></noscript></body></html>
