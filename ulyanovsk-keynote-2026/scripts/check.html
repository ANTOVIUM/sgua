<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Проверка презентации</title><style>body{margin:0;background:#d8dad7;color:#151718;font:14px Arial}header{padding:10px 16px;display:flex;gap:8px;align-items:center}button{font:inherit;cursor:pointer}#shell{position:relative;margin:0 auto;background:#151718}iframe{border:0;transform-origin:top left}#report{white-space:pre-wrap;max-height:125px;overflow:auto;padding:8px 16px;font:12px monospace;margin:0}</style><header><button data-size="1366,768">1366×768</button><button data-size="1920,1080">1920×1080</button><button data-size="2560,1440">2560×1440</button><button data-size="3840,2160">3840×2160</button><button data-size="1920,1200">16:10</button><button id="offline">Автономный запуск</button><button id="measure">Измерить</button><button id="audit">Все состояния</button><button id="stress">Устойчивость</button></header><div id="shell"><iframe id="qa-frame" title="Тестируемая презентация" src="present/?reset=1"></iframe></div><pre id="report"></pre><script>
const frame=document.querySelector('iframe'),shell=document.querySelector('#shell'),report=document.querySelector('#report');let size=[1920,1080];function fit(){const scale=Math.min(innerWidth/size[0],Math.max(100,innerHeight-184)/size[1]);frame.width=size[0];frame.height=size[1];frame.style.transform=`scale(${scale})`;shell.style.width=size[0]*scale+'px';shell.style.height=size[1]*scale+'px';}function bounds(){const w=frame.contentWindow,d=w.document,s=d.querySelector('.stage');if(!s)return{};const r=s.getBoundingClientRect();const bad=[...s.querySelectorAll('*')].filter(e=>{if(w.getComputedStyle(e).visibility==='hidden'||!e.textContent.trim()||e.children.length||e.closest('svg')||e.classList.contains('number-watermark'))return false;const q=e.getBoundingClientRect();return q.left<r.left-1||q.right>r.right+1||q.top<r.top-1||q.bottom>r.bottom+1;}).map(e=>e.textContent);return{viewport:[w.innerWidth,w.innerHeight],scene:s.dataset.scene,step:s.dataset.step,qa:s.dataset.qa,stage:[r.x,r.y,r.width,r.height],overflow:bad,scroll:[d.documentElement.scrollWidth>w.innerWidth,d.documentElement.scrollHeight>w.innerHeight],resources:w.performance.getEntriesByType('resource').map(x=>x.name),fontReady:d.fonts.check('16px Golos'),userAgent:w.navigator.userAgent};}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=b.dataset.size.split(',').map(Number);frame.src='present/?reset=1';fit();frame.onload=()=>{report.textContent=JSON.stringify(bounds(),null,2);};});document.querySelector('#offline').onclick=async()=>{const html=await(await fetch('standalone.html')).text();frame.removeAttribute('src');frame.srcdoc=html;frame.onload=()=>{report.textContent=JSON.stringify(bounds(),null,2);};};document.querySelector('#measure').onclick=async()=>{report.dataset.measured='pending';const w=frame.contentWindow,api=w.KEYNOTE_API;api.go(0,0);if(api.getState().reduced)api.action('reduced');let shifts=0;try{new w.PerformanceObserver(l=>l.getEntries().forEach(x=>{if(!x.hadRecentInput)shifts+=x.value;})).observe({type:'layout-shift',buffered:true});}catch{}for(let i=0;i<8;i++)await new Promise(r=>w.requestAnimationFrame(r));const measures=[];let prev;for(let i=0;i<121;i++)await new Promise(resolve=>w.requestAnimationFrame(t=>{if(prev!==undefined)measures.push(t-prev);prev=t;if(i%5===0)api.next();resolve();}));const sorted=measures.slice().sort((a,b)=>a-b),nodes=[];const heapBefore=w.performance.memory?.usedJSHeapSize;const runStart=w.performance.now();for(let k=0;k<40;k++){for(const t of api.steps)api.go(t.scene,t.step);nodes.push(w.document.querySelectorAll('*').length);}const heapAfter=w.performance.memory?.usedJSHeapSize;const data=bounds();data.frameTimes={samples:measures.length,mean:measures.reduce((a,b)=>a+b,0)/measures.length,median:sorted[Math.floor(sorted.length*.5)],p95:sorted[Math.floor(sorted.length*.95)],max:sorted.at(-1),over34ms:measures.filter(x=>x>34).length};data.stress={navigations:40*api.steps.length,domNodeMin:Math.min(...nodes),domNodeMax:Math.max(...nodes),durationMs:w.performance.now()-runStart,heapBefore,heapAfter};data.layoutShiftTotal=shifts;data.words=api.words();report.textContent=JSON.stringify(data,null,2);report.dataset.measured='done';};document.querySelector('#stress').onclick=()=>{report.dataset.measured='pending';const w=frame.contentWindow,api=w.KEYNOTE_API,counts=[],cycles=[],heapBefore=w.performance.memory?.usedJSHeapSize,start=w.performance.now();if(!api.getState().reduced)api.action('reduced');for(let k=0;k<40;k++){for(const t of api.steps){api.go(t.scene,t.step);counts.push(w.document.querySelectorAll('*').length);}cycles.push(w.document.querySelectorAll('*').length);}report.textContent=JSON.stringify({userAgent:w.navigator.userAgent,navigations:40*api.steps.length,cycleNodeMin:Math.min(...cycles),cycleNodeMax:Math.max(...cycles),stateNodeMin:Math.min(...counts),stateNodeMax:Math.max(...counts),heapBefore,heapAfter:w.performance.memory?.usedJSHeapSize,durationMs:w.performance.now()-start},null,2);report.dataset.measured='done';};document.querySelector('#audit').onclick=async()=>{report.dataset.measured='pending';const w=frame.contentWindow,api=w.KEYNOTE_API;const results=[];if(!api.getState().reduced)api.action('reduced');for(const res of [[1366,768],[1920,1080],[2560,1440],[3840,2160],[1920,1200]]){size=res;fit();api.fit();for(const t of api.steps){api.go(t.scene,t.step);const b=bounds();const cropped=[...w.document.querySelectorAll('.word-cut')].filter(e=>e.scrollWidth>e.clientWidth+2).map(e=>e.textContent);results.push({viewport:b.viewport,scene:b.scene,step:b.step,overflow:b.overflow,cropped,scroll:b.scroll});}for(let i=0;i<10;i++){api.qa(i);const b=bounds();results.push({viewport:b.viewport,qa:i,overflow:b.overflow,scroll:b.scroll});}}api.go(0,0);size=[1920,1080];fit();report.textContent=JSON.stringify({userAgent:w.navigator.userAgent,testedStates:results.length,failures:results.filter(x=>x.overflow.length||x.cropped?.length||x.scroll.some(Boolean)),words:api.words()},null,2);report.dataset.measured='done';};addEventListener('resize',fit);frame.onload=()=>report.textContent=JSON.stringify(bounds(),null,2);fit();
</script></html>
